# =============================================================================
# 下游规则源配置
# =============================================================================
# 基础规则会自动同步到 release 分支，同时保留可读 TXT。
# 需要合并的分类从文本重新编译为 MRS，并同步生成同名 TXT。
#
# 本文件不包含节点订阅，也不需要任何个人 Token。
# =============================================================================

version: 2

upstream:
  repo: https://github.com/666OS/rules.git
  branch: release
  artifact_root: mihomo
  game_store_source: https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Games.txt
  game_download_binary: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download.mrs

derived:
  - name: GameStore
    behavior: domain
    source_url: https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Games.txt
    files:
      - scripts/custom/game-store.list

custom:
  - name: GameDownloadCustom
    behavior: domain
    files:
      - scripts/custom/game-download.list

  - name: CrossBorder
    behavior: domain
    files:
      - scripts/custom/crossborder-ecommerce.list

  - name: CustomDirect
    behavior: domain
    files:
      - scripts/custom/custom-direct.list

  - name: CustomProxy
    behavior: domain
    files:
      - scripts/custom/custom-proxy.list

# scripts/custom/emby.list 默认不编译到公开产物，避免扩散私人影视服务域名；
# 如果确认要公开，再把它作为一个 custom 项加入。
