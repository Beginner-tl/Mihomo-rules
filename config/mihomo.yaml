# =============================================================================
# rule-providers —— 全部指向你的 release 分支（自建规则集）
# =============================================================================
rule-providers:
  # ★ 私有仓库认证头：把 <YOUR_GITHUB_TOKEN> 替换为你的 GitHub PAT（fine-grained，只需 contents:read 权限）
  #   生成地址: https://github.com/settings/tokens?type=beta → 限定本仓库 → 只读
  _gh_header: &gh_header
    Authorization: token <YOUR_GITHUB_TOKEN>
    Accept: application/vnd.github.raw+json
  # —— 本地/私有 ——
  Private:        { type: http, behavior: domain, format: mrs, interval: 86400, url: "https://api.github.com/repos/Beginner-tl/clash-rules/contents/mihomo/domain/Private.mrs?ref=release",        path: ./ruleset/Private.mrs , header: *gh_header }
  PrivateIP:      { type: http, behavior: ipcidr, format: mrs, interval: 86400, url: "https://api.github.com/repos/Beginner-tl/clash-rules/contents/mihomo/ip/PrivateIP.mrs?ref=release",          path: ./ruleset/PrivateIP.mrs, no-resolve: true , header: *gh_header }

  # —— 🛒 跨境电商（强制直连）——
