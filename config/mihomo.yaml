# =============================================================================
# rules —— 规则顺序（★ 从上到下匹配，命中即停，顺序至关重要）
# =============================================================================
rules:
  # 1. 本地/私有
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve

  # 2. 自建服务（EMBY / SNTP —— 放最前，确保私有域名不被通用规则捕获）
  - DOMAIN-SUFFIX,cn2gias.uk,EMBY
  - DOMAIN-KEYWORD,emby,EMBY
  - DOMAIN-SUFFIX,sntp.uk,EMBY
  - DOMAIN-SUFFIX,wuyouyun.com,EMBY
  - DOMAIN-SUFFIX,qzyidc.com,EMBY
  - DOMAIN-SUFFIX,alibabacloud.com,EMBY
  - RULE-SET,Emby,EMBY

  # 3. 🛒 跨境电商（天猫国际/菜鸟/阿里商家后台 → 直连）★ 置于国外流量之前，根治阿里被代理带走
  - RULE-SET,CrossBorder,DIRECT

  # 4. 网络测试
  - RULE-SET,Speedtest,网络测试

  # 5. 🤖 人工智能
  - RULE-SET,Perplexity,Perplexity
  - RULE-SET,Claude,Claude
  - RULE-SET,ChatGPT,ChatGPT
  - RULE-SET,Gemini,Gemini
  - RULE-SET,Copilot,Copilot

  # 6. 🎬 流媒体
  - RULE-SET,Netflix,Netflix
  - RULE-SET,NetflixIP,Netflix,no-resolve
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Disney,Disney
  - RULE-SET,Spotify,Spotify
  - RULE-SET,TikTok,TikTok
  - RULE-SET,BiliBili,哔哩哔哩

  # 7. 💬 即时通讯 / 社交
  - RULE-SET,Telegram,即时通讯
  - RULE-SET,TelegramIP,即时通讯,no-resolve
  - RULE-SET,Twitter,Twitter
  - RULE-SET,Instagram,Instagram
  - RULE-SET,Facebook,Facebook

  # 8. 💻 开发服务 / 平台
  - RULE-SET,GitHub,开发服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,GoogleIP,谷歌服务,no-resolve
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Apple,苹果服务

  # 9. 🎮 游戏（先匹配下载 CDN，再匹配商店）
  - RULE-SET,GameDownload,游戏下载
  - RULE-SET,GameStore,游戏商店

  # 10. 💰 货币平台
  - RULE-SET,Crypto,货币平台

  # 11. 国外流量兜底
  - RULE-SET,Proxy,国外流量
  - RULE-SET,ProxyIP,国外流量,no-resolve

  # 12. 国内直连
  - RULE-SET,China,国内流量
  - RULE-SET,ChinaIP,国内流量,no-resolve
  - GEOIP,CN,DIRECT

  # 13. 最终兜底
  - MATCH,漏网之鱼

# =============================================================================
# 基础设置（参照你的 Pro_cn.yaml，mihomo 现代配置）
# =============================================================================
mixed-port: 7893
allow-lan: false
bind-address: '*'
mode: rule
log-level: silent
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 600

# 控制面板
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: my-rules-secret
profile: { store-selected: true, store-fake-ip: true }

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS:  { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# TUN 模式（默认关闭，需要时改 enable: true）
tun:
  enable: false
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  fake-ip-filter:
    - "+.miwifi.com"
    - "+.docker.io"
    - "+.push.apple.com"
