# Sparkle / Mihomo 覆写
# 远程规则源：Beginner-tl/clash-rules；release MRS 自动更新，并叠加本仓库自定义规则
#
# 用法：
# 1. 在 Sparkle 的“覆写”中新建 YAML，并粘贴本文件内容；
# 2. 在目标订阅的“编辑信息 -> 覆写”中启用它；
# 3. 节点由 Sub-Store 导入的订阅提供，本文件只负责代理组、故障转移和分流。
#
# 说明：
# - +proxy-groups：追加代理组，不覆盖订阅原有代理组；
# - rules：用本文件的分流规则替换订阅原有规则，避免原规则先匹配导致分类不一致；
# - filter 按节点名称分类。节点名称不含地区关键词时，需要调整对应 filter。

+proxy-groups:
  # 路由策略
  - name: 广告拦截
    type: select
    proxies:
      - REJECT-DROP
      - REJECT
      - DIRECT

  - name: 网络测试
