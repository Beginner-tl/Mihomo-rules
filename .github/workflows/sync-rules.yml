# =============================================================================
# sync-rules.yml —— 以 666OS 已整合 MRS 为基线，自动同步并发布到 release
# =============================================================================
name: Sync Rules

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-rules.yml"

permissions:
  contents: write

concurrency:
  group: sync-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Download mihomo
        run: |
          set -euo pipefail
          TAG="$(python -c 'import json,sys,urllib.request; print(json.load(urllib.request.urlopen("https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"))["tag_name"])')"
          echo "mihomo tag: $TAG"
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$TAG/mihomo-linux-amd64-$TAG.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Build rulesets
        env:
          MIHOMO_BIN: ./mihomo
        run: bash scripts/build.sh

      - name: Verify output
        run: |
          set -euo pipefail
          test -s dist/mihomo/domain/GameStore.mrs
          test -s dist/mihomo/domain/GameDownload.mrs
          test -s dist/mihomo/domain/GameDownloadCustom.mrs
          test -s dist/mihomo/domain/CrossBorder.mrs
          test -s dist/mihomo/MANIFEST.json
          TOTAL="$(find dist/mihomo -name "*.mrs" | wc -l)"
          echo "generated $TOTAL MRS files"
          test "$TOTAL" -gt 0

      - name: Publish to release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/publish
          mkdir -p /tmp/publish
          cp -r dist/mihomo /tmp/publish/mihomo
          date -u +"%Y-%m-%d %H:%M:%S UTC" > /tmp/publish/BUILD_TIME.txt

          git switch --orphan release-publish
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -not -path "./.git*" -delete 2>/dev/null || true

          cp -r /tmp/publish/mihomo ./mihomo
          cp /tmp/publish/BUILD_TIME.txt ./BUILD_TIME.txt
          git add mihomo BUILD_TIME.txt
          git commit -m "chore(rules): sync 666OS downstream $(date -u +%Y-%m-%d)" --allow-empty
          git branch -M release
          git push --force origin release

      - name: Summary
        run: |
          {
            echo "## Rule sync completed"
            echo
            echo "- upstream: 666OS/rules @ release"
            echo "- MRS files: $(find dist/mihomo -name "*.mrs" | wc -l)"
            echo "- Sparkle override: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/sparkle-override.yaml"
            echo "- MRS base: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release/mihomo/<domain|ip>/<Name>.mrs"
          } >> "$GITHUB_STEP_SUMMARY"
